<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Rueda de Multiplicar - Estilo Bauhaus</title>
  <style>
    :root {
      --bauhaus-red: #D9381E;
      --bauhaus-blue: #124294;
      --bauhaus-yellow: #F5B800;
      --bauhaus-black: #111111;
      --bauhaus-bg: #F0EFE9;
      --bauhaus-card: #FFFFFF;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Trebuchet MS', 'Segoe UI', sans-serif;
      background-color: var(--bauhaus-bg);
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 20px;
      min-height: 100vh;
      color: var(--bauhaus-black);
    }

    h1 {
      font-size: 2rem;
      font-weight: 900;
      text-transform: uppercase;
      letter-spacing: 2px;
      margin-bottom: 15px;
      border-bottom: 4px solid var(--bauhaus-black);
      padding-bottom: 5px;
    }

    /* SELECTOR Y NAVEGACIÓN ESTILO BAUHAUS */
    .controls-top {
      display: flex;
      gap: 15px;
      align-items: center;
      margin-bottom: 25px;
      background: var(--bauhaus-card);
      padding: 12px 24px;
      border: 3px solid var(--bauhaus-black);
      box-shadow: 5px 5px 0px var(--bauhaus-black);
    }

    .btn-home {
      background-color: var(--bauhaus-red);
      color: var(--bauhaus-card);
      border: 3px solid var(--bauhaus-black);
      padding: 8px 16px;
      font-size: 1.5rem;
      font-weight: 900;
      text-transform: uppercase;
      cursor: pointer;
      box-shadow: 3px 3px 0px var(--bauhaus-black);
      transition: all 0.1s;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      gap: 5px;
    }

    .btn-home:hover {
      background-color: #b82d17;
    }

    .btn-home:active {
      transform: translate(2px, 2px);
      box-shadow: 1px 1px 0px var(--bauhaus-black);
    }

    .controls-top label {
      font-weight: 900;
      text-transform: uppercase;
      font-size: 0.9rem;
    }

    .controls-top select {
      padding: 8px 16px;
      font-size: 1.1rem;
      font-weight: 900;
      border: 3px solid var(--bauhaus-black);
      background-color: var(--bauhaus-yellow);
      cursor: pointer;
      outline: none;
    }

    /* CONTENEDOR DE LA RUEDA */
    .wheel-container {
      position: relative;
      width: 360px;
      height: 360px;
      margin: 10px 0 25px 0;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    /* APUNTADOR TRIANGULAR SUPERIOR */
    .indicator-arrow {
      position: absolute;
      top: -18px;
      z-index: 10;
      width: 0; 
      height: 0; 
      border-left: 15px solid transparent;
      border-right: 15px solid transparent;
      border-top: 25px solid var(--bauhaus-red);
      filter: drop-shadow(0px 3px 0px var(--bauhaus-black));
    }

    /* ANILLO EXTERIOR GIRATORIO */
    .outer-wheel {
      position: absolute;
      width: 360px;
      height: 360px;
      border-radius: 50%;
      background: var(--bauhaus-red);
      border: 5px solid var(--bauhaus-black);
      transition: transform 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
      box-shadow: 6px 6px 0px var(--bauhaus-black);
    }

    /* ANILLO MEDIO FIJO */
    .middle-wheel {
      position: absolute;
      width: 240px;
      height: 240px;
      border-radius: 50%;
      background: var(--bauhaus-blue);
      border: 5px solid var(--bauhaus-black);
      z-index: 2;
    }

    /* CÍRCULO CENTRAL FIJO */
    .center-wheel {
      position: absolute;
      width: 120px;
      height: 120px;
      border-radius: 50%;
      background: var(--bauhaus-yellow);
      border: 5px solid var(--bauhaus-black);
      display: flex;
      justify-content: center;
      align-items: center;
      font-size: 2.2rem;
      font-weight: 900;
      color: var(--bauhaus-black);
      z-index: 3;
    }

    /* LÍNEAS DIVISORIAS */
    .slice-line {
      position: absolute;
      top: 0;
      left: 50%;
      width: 3px;
      height: 100%;
      background-color: var(--bauhaus-black);
      transform-origin: center;
      margin-left: -1.5px;
    }

    /* NÚMEROS PERFECTAMENTE CENTRADOS */
    .number-node {
      position: absolute;
      width: 40px;
      height: 40px;
      display: flex;
      justify-content: center;
      align-items: center;
      font-weight: 900;
      font-size: 1.2rem;
      color: var(--bauhaus-card);
      transform: translate(-50%, -50%);
      cursor: pointer;
      user-select: none;
    }

    .outer-node {
      font-size: 1.3rem;
      color: var(--bauhaus-card);
    }

    /* BOTONES DE CONTROL */
    .spin-buttons {
      display: flex;
      gap: 15px;
      margin-bottom: 25px;
    }

    .btn-rotate {
      background: var(--bauhaus-blue);
      color: var(--bauhaus-card);
      border: 3px solid var(--bauhaus-black);
      padding: 12px 24px;
      font-size: 1rem;
      font-weight: 900;
      text-transform: uppercase;
      cursor: pointer;
      box-shadow: 4px 4px 0px var(--bauhaus-black);
      transition: all 0.1s;
    }

    .btn-rotate:hover {
      background: #0f3678;
    }

    .btn-rotate:active {
      transform: translate(2px, 2px);
      box-shadow: 2px 2px 0px var(--bauhaus-black);
    }

    /* TARJETA DE PREGUNTA */
    .quiz-card {
      background: var(--bauhaus-card);
      padding: 25px 35px;
      border: 4px solid var(--bauhaus-black);
      box-shadow: 7px 7px 0px var(--bauhaus-black);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 15px;
      width: 100%;
      max-width: 360px;
    }

    .math-expr {
      font-size: 2.2rem;
      font-weight: 900;
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .math-expr input {
      width: 85px;
      height: 55px;
      font-size: 2rem;
      text-align: center;
      font-weight: 900;
      border: 4px solid var(--bauhaus-black);
      background-color: var(--bauhaus-bg);
      outline: none;
    }

    .math-expr input:focus {
      background-color: #FFF;
      border-color: var(--bauhaus-blue);
    }

    .btn-check {
      background-color: var(--bauhaus-yellow);
      color: var(--bauhaus-black);
      border: 3px solid var(--bauhaus-black);
      padding: 12px;
      font-size: 1.1rem;
      font-weight: 900;
      text-transform: uppercase;
      cursor: pointer;
      width: 100%;
      box-shadow: 4px 4px 0px var(--bauhaus-black);
      transition: all 0.1s;
    }

    .btn-check:hover { background-color: #e0a800; }
    .btn-check:active {
      transform: translate(2px, 2px);
      box-shadow: 2px 2px 0px var(--bauhaus-black);
    }

    .feedback-msg {
      font-size: 1.1rem;
      font-weight: 900;
      min-height: 28px;
      text-align: center;
      text-transform: uppercase;
    }

    .correct { color: #0d7a3e; }
    .incorrect { color: var(--bauhaus-red); }
  </style>
</head>
<body>

  <h1>rueda de multiplicar</h1>

  <div class="controls-top">
    <button class="btn-home" onclick="goToHome()">⌂ Inicio</button>
    <label for="table-select">Tabla:</label>
    <select id="table-select" onchange="changeTable(this.value)"></select>
  </div>

  <div class="wheel-container">
    <div class="indicator-arrow"></div>
    <div class="outer-wheel" id="outer-wheel"></div>
    <div class="middle-wheel" id="middle-wheel"></div>
    <div class="center-wheel" id="center-label">4 x</div>
  </div>

  <div class="spin-buttons">
    <button class="btn-rotate" onclick="rotateWheel(-30)">↺ Izquierda</button>
    <button class="btn-rotate" onclick="rotateWheel(30)">Derecha ↻</button>
  </div>

  <div class="quiz-card">
    <div class="math-expr">
      <span id="exp-factor1">4</span> × <span id="exp-factor2">1</span> =
      <input type="number" id="user-answer" placeholder="?" autocomplete="off">
    </div>
    <button class="btn-check" onclick="checkAnswer()">Comprobar</button>
    <div class="feedback-msg" id="feedback"></div>
  </div>

  <script>
    // SINTETIZADOR DE SONIDO CON WEB AUDIO API
    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();

    // Clic mecánico para el giro
    function playClickSound() {
      if (audioCtx.state === 'suspended') {
        audioCtx.resume();
      }

      const bufferSize = audioCtx.sampleRate * 0.015;
      const buffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
      const output = buffer.getChannelData(0);

      for (let i = 0; i < bufferSize; i++) {
        output[i] = Math.random() * 2 - 1;
      }

      const whiteNoise = audioCtx.createBufferSource();
      whiteNoise.buffer = buffer;

      const filter = audioCtx.createBiquadFilter();
      filter.type = 'highpass';
      filter.frequency.value = 1200;

      const gain = audioCtx.createGain();
      gain.gain.setValueAtTime(0.4, audioCtx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.015);

      whiteNoise.connect(filter);
      filter.connect(gain);
      gain.connect(audioCtx.destination);

      whiteNoise.start();
    }

    // SONIDO POSITIVO SINTETIZADO (ARPEGIO DE VICTORIA)
    function playPositiveSound() {
      if (audioCtx.state === 'suspended') {
        audioCtx.resume();
      }

      const notes = [523.25, 659.25, 783.99, 1046.50];
      const now = audioCtx.currentTime;

      notes.forEach((freq, index) => {
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();

        osc.type = 'triangle';
        osc.frequency.setValueAtTime(freq, now + index * 0.08);

        gain.gain.setValueAtTime(0, now + index * 0.08);
        gain.gain.linearRampToValueAtTime(0.2, now + index * 0.08 + 0.01);
        gain.gain.exponentialRampToValueAtTime(0.001, now + index * 0.08 + 0.25);

        osc.connect(gain);
        gain.connect(audioCtx.destination);

        osc.start(now + index * 0.08);
        osc.stop(now + index * 0.08 + 0.25);
      });
    }

    // Función para volver a la pantalla principal
    function goToHome() {
      playClickSound();
      // Cambia 'index.html' por la ruta deseada o lógica de tu app
      window.location.href = 'index.html'; 
    }

    let currentTable = 4;
    let currentMultiplier = 1;
    let currentRotation = 0;

    const outerWheel = document.getElementById('outer-wheel');
    const middleWheel = document.getElementById('middle-wheel');
    const centerLabel = document.getElementById('center-label');
    const tableSelect = document.getElementById('table-select');

    function initSelectOptions() {
      for (let i = 1; i <= 12; i++) {
        const opt = document.createElement('option');
        opt.value = i;
        opt.innerText = `Tabla del ${i}`;
        if (i === 4) opt.selected = true;
        tableSelect.appendChild(opt);
      }
    }

    function drawWheels() {
      middleWheel.innerHTML = '';
      outerWheel.innerHTML = '';

      const radiusMiddle = 85;
      const radiusOuter = 145;

      for (let i = 1; i <= 12; i++) {
        const lineM = document.createElement('div');
        lineM.className = 'slice-line';
        lineM.style.transform = `rotate(${(i - 1) * 30 + 15}deg)`;
        middleWheel.appendChild(lineM);

        const lineO = document.createElement('div');
        lineO.className = 'slice-line';
        lineO.style.transform = `rotate(${(i - 1) * 30 + 15}deg)`;
        outerWheel.appendChild(lineO);

        const angleDeg = (i - 1) * 30 - 90;
        const angleRad = (angleDeg * Math.PI) / 180;

        const xM = 120 + radiusMiddle * Math.cos(angleRad);
        const yM = 120 + radiusMiddle * Math.sin(angleRad);
        const nodeM = document.createElement('div');
        nodeM.className = 'number-node';
        nodeM.style.left = `${xM}px`;
        nodeM.style.top = `${yM}px`;
        nodeM.innerText = i;
        nodeM.onclick = () => selectMultiplier(i);
        middleWheel.appendChild(nodeM);

        const xO = 180 + radiusOuter * Math.cos(angleRad);
        const yO = 180 + radiusOuter * Math.sin(angleRad);
        const nodeO = document.createElement('div');
        nodeO.className = 'number-node outer-node';
        nodeO.style.left = `${xO}px`;
        nodeO.style.top = `${yO}px`;
        nodeO.id = `outer-ans-${i}`;
        nodeO.innerText = currentTable * i;
        outerWheel.appendChild(nodeO);
      }
    }

    function changeTable(val) {
      currentTable = parseInt(val);
      centerLabel.innerText = `${currentTable} x`;

      for (let i = 1; i <= 12; i++) {
        const node = document.getElementById(`outer-ans-${i}`);
        if (node) node.innerText = currentTable * i;
      }

      updateQuiz();
    }

    function rotateWheel(deg) {
      playClickSound();
      currentRotation += deg;
      outerWheel.style.transform = `rotate(${currentRotation}deg)`;

      let normalizedDeg = (-currentRotation) % 360;
      if (normalizedDeg < 0) normalizedDeg += 360;
      
      const sector = Math.round(normalizedDeg / 30) + 1;
      currentMultiplier = sector > 12 ? 1 : sector;

      updateQuiz();
    }

    function selectMultiplier(mult) {
      playClickSound();
      currentMultiplier = mult;
      currentRotation = -(mult - 1) * 30;
      outerWheel.style.transform = `rotate(${currentRotation}deg)`;
      updateQuiz();
    }

    function updateQuiz() {
      document.getElementById('exp-factor1').innerText = currentTable;
      document.getElementById('exp-factor2').innerText = currentMultiplier;
      const input = document.getElementById('user-answer');
      input.value = '';
      input.focus();
      document.getElementById('feedback').innerText = '';
    }

    function checkAnswer() {
      const input = document.getElementById('user-answer');
      const val = parseInt(input.value);
      const expected = currentTable * currentMultiplier;
      const feedback = document.getElementById('feedback');

      if (isNaN(val)) {
        feedback.className = 'feedback-msg incorrect';
        feedback.innerText = 'Escribe un número';
        return;
      }

      if (val === expected) {
        feedback.className = 'feedback-msg correct';
        feedback.innerText = '¡Correcto!';
        playPositiveSound();
      } else {
        feedback.className = 'feedback-msg incorrect';
        feedback.innerText = 'Inténtalo de nuevo';
      }
    }

    document.getElementById('user-answer').addEventListener('keypress', function(e) {
      if (e.key === 'Enter') checkAnswer();
    });

    window.onload = () => {
      initSelectOptions();
      drawWheels();
      changeTable(4);
    };
  </script>
</body>
</html>
