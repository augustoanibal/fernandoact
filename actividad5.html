<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Actividad 5 - Lectura con Interferencia Visual</title>
  <style>
    body { font-family: system-ui, sans-serif; background: #f0f4f8; padding: 20px; color: #1e293b; max-width: 800px; margin: 0 auto; }
    .card { background: white; border-radius: 12px; padding: 24px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); margin-bottom: 20px; }
    .btn-back { display: inline-block; margin-bottom: 20px; padding: 8px 16px; background: #e2e8f0; color: #334155; text-decoration: none; border-radius: 8px; font-weight: 600; }
    .btn-back:hover { background: #cbd5e1; }
    .progress-bg { background: #e2e8f0; border-radius: 8px; height: 10px; width: 100%; overflow: hidden; margin-bottom: 20px; }
    .progress-bar { background: #2563eb; height: 100%; width: 25%; transition: width 0.3s ease; }
    .card-item { background: #f8fafc; border: 1px solid #e2e8f0; padding: 16px; border-radius: 8px; margin-bottom: 16px; }
    .interfered-text { font-size: 1.2rem; font-weight: bold; letter-spacing: 2px; color: #1e293b; background: #edf2f7; padding: 12px; border-radius: 6px; font-family: monospace; }
    input[type="text"] { width: 100%; padding: 10px; border: 1px solid #cbd5e1; border-radius: 6px; font-size: 1rem; margin-top: 8px; box-sizing: border-box; }
    .valid-input { border-color: #16a34a !important; background-color: #f0fdf4; }
    .invalid-input { border-color: #dc2626 !important; background-color: #fef2f2; }
    .btn-primary { background: #2563eb; color: white; border: none; padding: 12px 24px; border-radius: 8px; font-size: 1rem; font-weight: bold; cursor: pointer; }
    .btn-primary:hover { background: #1d4ed8; }
    .feedback-msg { font-weight: bold; margin-top: 15px; }
  </style>
</head>
<body>

  <a href="index.html" class="btn-back">← Volver al Menú Principal</a>

  <div class="card">
    <div id="act5-game-zone">
      <div class="progress-bg">
        <div id="act5-progress-bar" class="progress-bar"></div>
      </div>
      
      <span id="act5-group-title" style="color: #64748b; font-weight: 600;">Grupo 1 de 4</span>
      <h2 id="act5-section-title" style="margin-top: 4px;">Lectura con interferencia visual</h2>
      <p style="color: #64748b;">Lee la oración con interferencia y escríbela correctamente en la casilla de abajo.</p>

      <div id="act5-items-container"></div>
      <div id="act5-feedback" class="feedback-msg"></div>

      <button onclick="Act5.validateGroup()" class="btn-primary" style="margin-top: 15px;">Comprobar Grupo</button>
    </div>

    <div id="act5-final-screen" style="display: none; text-align: center; padding: 20px;">
      <h2>🎉 ¡Felicidades!</h2>
      <p>Has completado los 20 ejercicios de lectura con interferencia visual.</p>
      <a href="index.html" class="btn-primary" style="display: inline-block; text-decoration: none; margin-top: 15px;">Volver al Menú</a>
    </div>
  </div>

  <script>
    const Act5 = (() => {
      const groupsData = [
        {
          title: "Grupo 1: Espaciado irregular",
          items: [
            { display: "E l g a t o s a l e .", correct: "El gato sale." },
            { display: "L a r a n a s a l t a .", correct: "La rana salta." },
            { display: "E l t r e n p a s a .", correct: "El tren pasa." },
            { display: "L a n i ñ a m i r a .", correct: "La niña mira." },
            { display: "E l p e r r o l a d r a .", correct: "El perro ladra." }
          ]
        },
        {
          title: "Grupo 2: Espaciado irregular II",
          items: [
            { display: "E l p l a t o c a e .", correct: "El plato cae." },
            { display: "L a p l a n t a c r e c e .", correct: "La planta crece." },
            { display: "E l t r e n g r i s c r u z a .", correct: "El tren gris cruza." },
            { display: "L a f r u t a b r i l l a .", correct: "La fruta me brilla." },
            { display: "E l p á j a r o c a n t a .", correct: "El pájaro canta." }
          ]
        },
        {
          title: "Grupo 3: Interferencia con subrayados",
          items: [
            { display: "E__l n_iñ_o d_i_b_u_j_a .", correct: "El niño dibuja." },
            { display: "L__a m_es_a t_i_e_n_e v_a_s_o_s .", correct: "La mesa tiene vasos." },
            { display: "E__l b_ra_z_o s_u_b_e .", correct: "El brazo sube." },
            { display: "L__a p_ e_l_ o_t_a r_u_e_d_a .", correct: "La pelota rueda." },
            { display: "E__l g_r_u_p_o e_sp_e_r_a .", correct: "El grupo espera." }
          ]
        },
        {
          title: "Grupo 4: Interferencia combinada",
          items: [
            { display: "E l t r a_p_o c a_ e.", correct: "El trapo cae." },
            { display: "L a b r u _ m a s u b e .", correct: "La bruma sube." },
            { display: "E l g r i _ t o s u e n a .", correct: "El grito suena." },
            { display: "L a b l u _ s a s e m o v e .", correct: "La blusa se mueve." },
            { display: "E l c a_r_r_o g_i_r_a h_o_y .", correct: "El carro gira hoy." }
          ]
        }
      ];

      let currentGroupIndex = 0;

      function normalizeSentence(text) {
        if (!text) return "";
        return text.trim().toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g, "").replace(/[.,;]/g, "");
      }

      function renderGroup() {
        const group = groupsData[currentGroupIndex];
        document.getElementById('act5-group-title').innerText = `Grupo ${currentGroupIndex + 1} de ${groupsData.length}`;
        document.getElementById('act5-section-title').innerText = group.title;
        document.getElementById('act5-progress-bar').style.width = `${((currentGroupIndex + 1) / groupsData.length) * 100}%`;

        const container = document.getElementById('act5-items-container');
        container.innerHTML = '';

        group.items.forEach((item, idx) => {
          container.innerHTML += `
            <div class="card-item">
              <div class="interfered-text">${item.display}</div>
              <input type="text" id="act5-input-${idx}" autocomplete="off" placeholder="Escribe aquí la oración limpia...">
            </div>`;
        });

        document.getElementById('act5-feedback').innerText = '';
      }

      function validateGroup() {
        const group = groupsData[currentGroupIndex];
        let allCorrect = true;

        group.items.forEach((item, idx) => {
          const inputEl = document.getElementById(`act5-input-${idx}`);
          const userValue = normalizeSentence(inputEl.value);
          const expectedValue = normalizeSentence(item.correct);

          if (userValue === expectedValue) {
            inputEl.classList.remove('invalid-input');
            inputEl.classList.add('valid-input');
          } else {
            inputEl.classList.remove('valid-input');
            inputEl.classList.add('invalid-input');
            allCorrect = false;
          }
        });

        const feedbackEl = document.getElementById('act5-feedback');
        if (allCorrect) {
          feedbackEl.style.color = "#16a34a";
          feedbackEl.innerText = "¡Excelente! Has escrito las 5 oraciones correctamente.";

          setTimeout(() => {
            currentGroupIndex++;
            if (currentGroupIndex < groupsData.length) {
              renderGroup();
            } else {
              document.getElementById('act5-game-zone').style.display = 'none';
              document.getElementById('act5-final-screen').style.display = 'block';
            }
          }, 1500);
        } else {
          feedbackEl.style.color = "#dc2626";
          feedbackEl.innerText = "Hay oraciones incorrectas o incompletas (marcadas en rojo). Revisa la ortografía.";
        }
      }

      return { init: renderGroup, validateGroup };
    })();

    window.onload = () => {
      Act5.init();
    };
  </script>
</body>
</html>
